[project]
name = "sentinelscan"
version = "0.1.0"
description = "Defensive, authorized web security weakness scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.1",
  "jinja2>=3.1.4"
]

[project.scripts]
sentinelscan = "sentinelscan.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
